<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<title>Feature graphic</title>
<!-- Google Play's feature graphic, 1024×500. Open in a browser at that size and screenshot it, or render with
     docs/marketing/render.mjs. Logo and font from docs/marketing. -->
<style>
  @font-face { font-family: "Archivo"; src: url("../marketing/fonts/archivo-bold-112.ttf"); font-weight: 700; }
  html, body { margin: 0; background: #0B2B4A; }
  .g { width: 1024px; height: 500px; background: #0B2B4A; display: flex; flex-direction: column; align-items: center;
       justify-content: center; gap: 36px; padding: 0 128px; box-sizing: border-box;
       font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; }
  .g img { height: 118px; }
  /* Two lines with clear space on each side; Play crops the edges of the graphic in some placements. */
  .g p { margin: 0; max-width: 640px; color: #DCEBFA; font-size: 32px; line-height: 1.25; font-weight: 700;
         letter-spacing: -0.3px; text-align: center; text-wrap: balance; }
</style>
</head>
<body>
<div class="g">
  <img src="../marketing/logo/logo-dark.png" alt="">
  <p>Hvor lenge klarer husstanden seg uten strøm og vann?</p>
</div>
</body>
</html>
